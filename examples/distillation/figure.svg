<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="630" viewBox="0 0 1250 630" role="img" aria-label="Teacher-guided learning"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#47685f"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#202c35}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#5c6975}.name{font-size:22px;font-weight:600}.small{font-size:16px}.line{fill:none;stroke:#47685f;stroke-width:2.4}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="55" y="48">Teacher-guided learning</text><text class="sub" x="55" y="79">A fixed teacher supplies soft targets; only the student is updated.</text><g data-module="input"><rect x="55" y="220" width="210" height="160" rx="9" fill="#f3f5f7" stroke="#ccd4d9"/><text class="name" x="75" y="255">Shared input</text><text class="small" x="75" y="283">Same sample x</text><text class="small" x="77" y="330">x</text><circle id="e0-out" data-port="" cx="265" cy="300.0" r="2" fill="#47685f"/><circle id="e1-out" data-port="" cx="265" cy="300.0" r="2" fill="#47685f"/></g><g data-module="teacher"><rect x="370" y="110" width="300" height="175" rx="9" fill="#eef5f0" stroke="#ccd4d9"/><text class="name" x="390" y="145">Frozen teacher</text><text class="small" x="390" y="173">Soft target distribution</text><rect x="400" y="227" width="25" height="28" fill="#789c89"/><rect x="444" y="243" width="25" height="12" fill="#789c89"/><rect x="488" y="215" width="25" height="40" fill="#789c89"/><rect x="532" y="237" width="25" height="18" fill="#789c89"/><rect x="576" y="245" width="25" height="10" fill="#789c89"/><text class="small" x="390" y="275">illustrative probabilities</text><circle id="e0-in" data-port="" cx="370" cy="197.5" r="2" fill="#47685f"/><circle id="e2-out" data-port="" cx="670" cy="197.5" r="2" fill="#47685f"/></g><g data-module="student"><rect x="370" y="355" width="300" height="175" rx="9" fill="#f5f0e9" stroke="#ccd4d9"/><text class="name" x="390" y="390">Trainable student</text><text class="small" x="390" y="418">Predicted distribution</text><rect x="400" y="478" width="25" height="22" fill="#c2a16d"/><rect x="444" y="484" width="25" height="16" fill="#c2a16d"/><rect x="488" y="467" width="25" height="33" fill="#c2a16d"/><rect x="532" y="477" width="25" height="23" fill="#c2a16d"/><rect x="576" y="486" width="25" height="14" fill="#c2a16d"/><text class="small" x="390" y="520">illustrative probabilities</text><circle id="e1-in" data-port="" cx="370" cy="442.5" r="2" fill="#47685f"/><circle id="e3-out" data-port="" cx="670" cy="442.5" r="2" fill="#47685f"/><circle id="e4-in" data-port="" cx="520.0" cy="530" r="2" fill="#47685f"/></g><g data-module="loss"><rect x="835" y="235" width="335" height="175" rx="9" fill="#edf2f7" stroke="#ccd4d9"/><text class="name" x="855" y="270">Distillation loss</text><text class="small" x="855" y="298">D_KL ( p_T || p_S )</text><text class="small" x="857" y="345">Stop gradient to teacher</text><circle id="e2-in" data-port="" cx="835" cy="290" r="2" fill="#47685f"/><circle id="e3-in" data-port="" cx="835" cy="365" r="2" fill="#47685f"/><circle id="e4-out" data-port="" cx="1002.5" cy="410" r="2" fill="#47685f"/></g><path class="line" data-edge="e0" data-from="#e0-out" data-to="#e0-in" d="M265 300.0H317.5V197.5H370" marker-end="url(#arrow)"/><text class="small" text-anchor="middle" x="276" y="184.5">sample x</text><path class="line" data-edge="e1" data-from="#e1-out" data-to="#e1-in" d="M265 300.0H317.5V442.5H370" marker-end="url(#arrow)"/><text class="small" text-anchor="middle" x="276" y="429.5">sample x</text><path class="line" data-edge="e2" data-from="#e2-out" data-to="#e2-in" d="M670 197.5H752.5V290H835" marker-end="url(#arrow)"/><text class="small" text-anchor="middle" x="793.75" y="277">soft targets</text><path class="line" data-edge="e3" data-from="#e3-out" data-to="#e3-in" d="M670 442.5H752.5V365H835" marker-end="url(#arrow)"/><text class="small" text-anchor="middle" x="793.75" y="352">predictions</text><path class="line" data-edge="e4" data-from="#e4-out" data-to="#e4-in" d="M1002.5 410V570H520.0V530" marker-end="url(#arrow)"/><text class="small" text-anchor="middle" x="710" y="562">student update</text><text class="sub" x="55" y="605">METHOD SCHEMATIC · Original geometry · No experimental results</text></svg>